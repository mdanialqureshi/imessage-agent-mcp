name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS too, so the reader (helper/reader.c) is compiled and tested.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Public-repo safety (all files, commit authors and messages)
        run: npm run safety:all
      - run: npm test
      - name: Build and test the Mac app
        if: runner.os == 'macOS'
        run: npm run test:app
