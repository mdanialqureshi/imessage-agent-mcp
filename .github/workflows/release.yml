name: Release

# Releases are built, signed with a Developer ID, notarized and signed for the updater on the
# maintainer's Mac (docs/releasing.md), then published by hand with their tag. Pushing that tag
# runs this workflow, which checks the release from the outside.
#
# Three jobs. `build` builds the app from the tagged source, running only this project's own
# scripts (no dependency code: npm installs without scripts, and the build never loads a
# package), and `test` runs the tests and the app tests on that build, on a copy it downloads.
# `check` downloads what was actually published and checks it: the tag is on master and matches
# package.json, the files match SHA256SUMS.txt and nothing else is attached, that file carries a
# valid signature from the release key built into the app, and the app is this version, signed
# by a Developer ID, with notarization tickets stapled to the app and disk image. Nothing here
# holds a signing key or can write to the repo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Public-repo safety (all files, commit authors and messages)
        run: npm run safety:all
      - name: Build the app (Apple silicon and Intel)
        run: node scripts/build-app.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Test the build
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          ditto -x -k dist/Messages-Agent-*.zip dist/
          IMESSAGE_AGENT_APP='dist/Messages Agent.app' node --test test/app.test.ts

  check:
    needs: [build, test]
    # Only a pushed tag has a release to check.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on master and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published || {
            echo "::error::No release for $GITHUB_REF_NAME. Build, notarize and publish it first (docs/releasing.md), then push the tag."
            exit 1
          }
      - name: The files are exactly the ones listed, and match their checksums
        working-directory: published
        run: |
          diff <(ls | sort) <( (cut -d' ' -f3 SHA256SUMS.txt; echo SHA256SUMS.txt; echo SHA256SUMS.txt.sig) | sort)
          shasum -a 256 -c SHA256SUMS.txt
      - name: The checksums carry the release key's signature (the one built into the app)
        working-directory: published
        run: |
          grep -o "UPDATE_PUBLIC_KEY = '[^']*'" ../src/update.ts | cut -d"'" -f2 | base64 -d > "$RUNNER_TEMP/pub.der"
          test -s "$RUNNER_TEMP/pub.der"
          base64 -d -i SHA256SUMS.txt.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/pub.der" -rawin -in SHA256SUMS.txt -sigfile "$RUNNER_TEMP/sig.bin"
      - name: The app is this version, signed with a Developer ID and notarized
        working-directory: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          ditto -x -k --norsrc --noextattr --noacl Messages-Agent-*.zip app
          bundle="app/Messages Agent.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$bundle/Contents/Info.plist")" = "$version"
          codesign --verify --deep --strict "$bundle"
          for target in "$bundle" "$bundle/Contents/Helpers/Messages Agent Reader.app"; do
            codesign -dvv "$target" 2>&1 | grep -q '^Authority=Developer ID Application: '
            codesign -dvv "$target" 2>&1 | grep -Eq '^TeamIdentifier=[0-9A-Z]{10}$'
          done
          xcrun stapler validate "$bundle"
          xcrun stapler validate Messages-Agent-*.dmg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Test the published app
        run: IMESSAGE_AGENT_APP='published/app/Messages Agent.app' node --test test/app.test.ts
