name: Release

# Pushing a tag like v0.2.0 builds the Mac app, tests the build, and publishes it as a GitHub
# release. Running it by hand only builds and tests.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    permissions:
      contents: write # to publish the release
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Public-repo safety (all files, commit authors and messages)
        run: npm run safety:all
      - run: npm test
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build the app (Apple silicon and Intel)
        run: node scripts/build-app.mjs
      - name: Test the build
        run: IMESSAGE_AGENT_APP=dist/imessage-agent.app node --test test/app.test.ts
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "imessage-agent $GITHUB_REF_NAME" --notes-file .github/release-notes.md
